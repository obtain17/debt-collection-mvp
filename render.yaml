databases:
  - name: debt-collection-db
    databaseName: debt_collection
    user: debt_collection
    plan: free # Render free Postgres expires 30 days after creation — recreate/upgrade before then.

services:
  - type: web
    name: debt-collection-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # If Render doesn't offer "free" for this service type anymore, pick the cheapest available.
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: debt-collection-db
          property: connectionString
      - key: JWT_SECRET
        sync: false # Set to a random 32+ byte secret (e.g. `openssl rand -base64 32`); do not reuse the local dev value.
      - key: DEMO_PASSWORD
        sync: false # Overrides the "demo1234" default in prisma/seed.ts so the public demo doesn't ship a documented shared password.
      - key: APP_BASE_URL
        sync: false # Set to this service's public https://...onrender.com URL once Render assigns it (needed for correct portal links in dunning emails).
      - key: AI_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false # Optional: without it, claims stay in "not analyzed" state and AI re-analysis is a no-op.
      - key: SMTP_HOST
        sync: false # Optional: without a real SMTP provider, dunning emails fail gracefully (logged as FAILED) — all other features still work.
      - key: SMTP_PORT
        sync: false

  - type: worker
    name: debt-collection-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # If Render doesn't offer "free" for background workers, this is the one service you may need to bump to Starter.
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: debt-collection-db
          property: connectionString
      - key: JWT_SECRET
        sync: false # Must match the web service's value exactly.
      - key: APP_BASE_URL
        sync: false # Must match the web service's value exactly.
      - key: AI_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
